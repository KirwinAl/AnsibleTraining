- name: Removing Sub-interfaces 
  hosts: routers
  tasks:
    - name: Remove Gi2.10 
      cisco.ios.ios_config:
        lines:
          - no interface GigabitEthernet2.10

    - name: Remove Gi2.20 
      cisco.ios.ios_config:
        lines:
          - no interface GigabitEthernet2.20
          
    - name: Remove Gi2.30 
      cisco.ios.ios_config:
        lines:
          - no interface GigabitEthernet2.30

- name: Shutting down GigabitEthernet2
  hosts: routers
  tasks:
    - name: Shut down interfaces
      cisco.ios.ios_config:
        lines:
          - shutdown
        parents:
          - interface GigabitEthernet2

- name: Save configuration
  hosts: routers
  tasks:
    - name: Save configuration if modified
      cisco.ios.ios_config:
        save_when: modified