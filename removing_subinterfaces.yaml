- name: Removing Sub-interfaces 
  hosts: routers
  tasks:
    - name: Remove Gi0/1.10 
      cisco.ios.ios_config:
        lines:
          - no interface GigabitEthernet0/1.10

    - name: Remove Gi0/1.20 
      cisco.ios.ios_config:
        lines:
          - no interface GigabitEthernet0/1.20
          
    - name: Remove Gi0/1.30 
      cisco.ios.ios_config:
        lines:
          - no interface GigabitEthernet0/1.30

- name: Shutting down GigabitEthernet0/1
  hosts: routers
  tasks:
    - name: Shut down interfaces
      cisco.ios.ios_config:
        lines:
          - shutdown
        parents:
          - interface GigabitEthernet0/1

- name: Save configuration
  hosts: routers
  tasks:
    - name: Save configuration if modified
      cisco.ios.ios_config:
        save_when: modified