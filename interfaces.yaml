- name: Enabling GigabitEthernet2
  hosts: routers
  tasks:
    - name: Turn on interfaces
      cisco.ios.ios_config:
        lines:
          - no shutdown
        parents:
          - interface GigabitEthernet2

- name: Creating Sub-interfaces 
  hosts: routers
  tasks:
    - name: Create Gi1.10 
      cisco.ios.ios_config:
        lines:
          - encapsulation dot1Q 10
          - description Management VLAN
          - ip address 192.168.123.2 255.255.255.192
        parents:
          - interface GigabitEthernet2.1

    - name: Create Gi1.20
      cisco.ios.ios_config:
        lines:
          - encapsulation dot1Q 20
          - description Users VLAN
          - ip address 192.168.123.66 255.255.255.192
        parents:
          - interface GigabitEthernet2.20
          
    - name: Create Gi1.30
      cisco.ios.ios_config:
        lines:
          - encapsulation dot1Q 30
          - description Reserved VLAN
          - ip address 192.168.123.130 255.255.255.192
        parents:
          - interface GigabitEthernet2.30

# Seeing that it's not saving, this is needed.
- name: Save configuration
  hosts: routers
  tasks:
    - name: Save configuration if modified
      cisco.ios.ios_config:
        save_when: modified